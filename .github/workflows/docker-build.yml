name: Docker Build & Toolchain Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ccr-toolchain:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify toolchains
        run: |
          docker run --rm ccr-toolchain:test bash -ec '
            echo "::group::Go"
            go version
            echo "::endgroup::"

            echo "::group::Rust"
            rustc --version
            cargo --version
            echo "::endgroup::"

            echo "::group::Python & pip"
            python3 --version
            pip3 --version
            echo "::endgroup::"

            echo "::group::uv"
            uv --version
            echo "::endgroup::"

            echo "::group::nvm & Node"
            export NVM_DIR=/root/.nvm
            . "$NVM_DIR/nvm.sh"
            nvm --version
            node --version
            npm --version
            echo "::endgroup::"

            echo "All toolchains verified."
          '
